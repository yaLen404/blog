<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 558" width="1000" height="558" role="img" aria-labelledby="t5 t5d">
  <title id="t5">稠密 FFN 与 MoE 的总参数 / 激活参数对比</title>
  <desc id="t5d">稠密 FFN 总参数 1600M、每 token 激活 1600M；8 专家 MoE 总参数同为 1600M，但每 token 只激活 400M。</desc>
  <text x="40" y="40" style="font:600 17px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#1f2937">稠密 FFN</text>
  <rect x="40" y="56" width="336" height="220" rx="12" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
  <text x="208" y="156" style="font:600 22px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">FFN</text>
  <text x="208" y="192" style="font:700 20px Consolas,'SFMono-Regular',monospace" text-anchor="middle" fill="#4b5563">1600M</text>
  <text x="208" y="226" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="middle">全部参数参与计算</text>
  <text x="440" y="40" style="font:600 17px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#1f2937">MoE：8 位专家，每 token 只请 2 位</text>
  <rect x="440" y="56" width="536" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="456" y="74" width="238" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="470" y="101" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" fill="#94a3b8">Expert 1</text>
  <text x="680" y="101" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="end" fill="#94a3b8">200M</text>
  <rect x="710" y="74" width="238" height="42" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.9"/>
  <text x="724" y="101" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" fill="#3730a3">Expert 2</text>
  <text x="934" y="101" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="end" fill="#6366f1">200M</text>
  <rect x="456" y="124" width="238" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="470" y="151" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" fill="#94a3b8">Expert 3</text>
  <text x="680" y="151" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="end" fill="#94a3b8">200M</text>
  <rect x="710" y="124" width="238" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="724" y="151" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" fill="#94a3b8">Expert 4</text>
  <text x="934" y="151" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="end" fill="#94a3b8">200M</text>
  <rect x="456" y="174" width="238" height="42" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.9"/>
  <text x="470" y="201" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" fill="#166534">Expert 5</text>
  <text x="680" y="201" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="end" fill="#22c55e">200M</text>
  <rect x="710" y="174" width="238" height="42" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.9"/>
  <text x="724" y="201" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" fill="#854d0e">Expert 6</text>
  <text x="934" y="201" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="end" fill="#eab308">200M</text>
  <rect x="456" y="224" width="238" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.9"/>
  <text x="470" y="251" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" fill="#92400e">Expert 7</text>
  <text x="680" y="251" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="end" fill="#f59e0b">200M</text>
  <rect x="710" y="224" width="238" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="724" y="251" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" fill="#94a3b8">Expert 8</text>
  <text x="934" y="251" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="end" fill="#94a3b8">200M</text>
  <text x="456" y="264" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280">粗框 = 负载较重的专家（Expert 2 / 5 / 6 / 7）；每 token 实际只激活其中 2 位。</text>
  <text x="40" y="322" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827">总参数（模型容量）</text>
  <rect x="260" y="306" width="300" height="24" rx="4" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/>
  <text x="576" y="324" style="font:700 15px Consolas,'SFMono-Regular',monospace" fill="#4b5563">1600M</text>
  <rect x="676" y="306" width="300" height="24" rx="4" fill="#6366f1" stroke="#6366f1" stroke-width="1"/>
  <text x="988" y="324" style="font:700 15px Consolas,'SFMono-Regular',monospace" text-anchor="end" fill="#4338ca">1600M</text>
  <text x="40" y="356" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" fill="#4338ca">MoE = 8 × 200M = 1600M，1600M 与稠密版完全相等</text>
  <text x="40" y="406" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827">激活参数 / token（算力开销）</text>
  <rect x="260" y="390" width="300" height="24" rx="4" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/>
  <text x="576" y="408" style="font:700 15px Consolas,'SFMono-Regular',monospace" fill="#4b5563">1600M</text>
  <rect x="676" y="390" width="75" height="24" rx="4" fill="#22c55e" stroke="#22c55e" stroke-width="1"/>
  <text x="764" y="408" style="font:700 15px Consolas,'SFMono-Regular',monospace" fill="#15803d">400M</text>
  <text x="40" y="440" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" fill="#16a34a">只有 25% —— 单 token 的算力开销接近一个小模型</text>
  <rect x="40" y="466" width="936" height="62" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="60" y="492" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" fill="#15803d">总参数不变、激活参数降到四分之一：这就是 MoE 把「模型容量」与「每 token 计算量」解耦的关键。</text>
  <text x="60" y="516" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" fill="#166534">换算一下：稠密版每 token 要算 1600M，MoE 只要 400M，而模型容量并没有缩水。</text>
</svg>
