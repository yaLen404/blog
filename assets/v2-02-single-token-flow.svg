<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 497" width="1000" height="497" role="img" aria-labelledby="t2 t2d">
  <title id="t2">单个 token 的 MoE 路由计算流程（8 专家，Top-2）</title>
  <desc id="t2d">对 8 个专家打分，Top-2 选出得分最高的两位，Softmax 分配权重，加权求和得到该 token 的输出。</desc>
  <defs><marker id="a2" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
  <text x="24" y="40" style="font:600 17px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#1f2937">① Router 用参数矩阵 W_r 对 8 位专家打分</text>
  <rect x="88" y="66" width="108" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="142.0" y="92" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#6b21a8">E1</text>
  <text x="142.0" y="116" style="font:700 17px Consolas,'SFMono-Regular',monospace" text-anchor="middle" fill="#9ca3af">1</text>
  <rect x="204" y="66" width="108" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.2"/>
  <text x="258.0" y="92" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#3730a3">E2</text>
  <text x="258.0" y="116" style="font:700 17px Consolas,'SFMono-Regular',monospace" text-anchor="middle" fill="#3730a3">4</text>
  <rect x="320" y="66" width="108" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="374.0" y="92" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#1e40af">E3</text>
  <text x="374.0" y="116" style="font:700 17px Consolas,'SFMono-Regular',monospace" text-anchor="middle" fill="#9ca3af">2</text>
  <rect x="436" y="66" width="108" height="60" rx="8" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2.2"/>
  <text x="490.0" y="92" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#115e59">E4</text>
  <text x="490.0" y="116" style="font:700 17px Consolas,'SFMono-Regular',monospace" text-anchor="middle" fill="#115e59">5</text>
  <rect x="552" y="66" width="108" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="606.0" y="92" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#166534">E5</text>
  <text x="606.0" y="116" style="font:700 17px Consolas,'SFMono-Regular',monospace" text-anchor="middle" fill="#9ca3af">0</text>
  <rect x="668" y="66" width="108" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="722.0" y="92" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#854d0e">E6</text>
  <text x="722.0" y="116" style="font:700 17px Consolas,'SFMono-Regular',monospace" text-anchor="middle" fill="#9ca3af">3</text>
  <rect x="784" y="66" width="108" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="838.0" y="92" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#92400e">E7</text>
  <text x="838.0" y="116" style="font:700 17px Consolas,'SFMono-Regular',monospace" text-anchor="middle" fill="#9ca3af">2</text>
  <rect x="900" y="66" width="108" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="954.0" y="92" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#9f1239">E8</text>
  <text x="954.0" y="116" style="font:700 17px Consolas,'SFMono-Regular',monospace" text-anchor="middle" fill="#9ca3af">1</text>
  <text x="24" y="156" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280">得分向量 O（1 × 8）：实线框为分数最高的两位</text>
  <text x="24" y="182" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="#3730a3">② Top-2 结果：Expert 4（5 分）与 Expert 2（4 分）；其余 6 位本轮权重为 0。</text>
  <text x="24" y="222" style="font:600 15px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#1f2937">③ Softmax 只对入选的两个分数做归一化</text>
  <rect x="24" y="238" width="452" height="84" rx="9" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="44" y="270" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" fill="#115e59">Expert 4</text>
  <text x="456" y="270" style="font:600 14px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="end" fill="#115e59">× 0.731</text>
  <text x="44" y="304" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" fill="#3730a3">Expert 2</text>
  <text x="456" y="304" style="font:600 14px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="end" fill="#3730a3">× 0.269</text>
  <rect x="504" y="238" width="472" height="84" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="524" y="270" style="font:600 13px Consolas,'SFMono-Regular',monospace" fill="#334155">h₀ = out(E2) × 0.269 + out(E4) × 0.731</text>
  <text x="524" y="298" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280">权重之和恒为 1</text>
  <text x="524" y="322" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280"></text>
  <text x="24" y="362" style="font:600 15px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#1f2937">④ 完整流程</text>
  <rect x="24" y="378" width="952" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="44" y="412" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="#3730a3">t₀ → Router 打分 → Top-k 选择（k=2）→ 被选中的 FFN 各自计算 → 结果按权相加 → h₀</text>
  <text x="24" y="464" style="font:italic 12px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#9ca3af">关键：Top-k 决定「谁上场」，Softmax 只在入选者之间分配权重。</text>
</svg>
