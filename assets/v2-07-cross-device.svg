  <text x="709" y="172" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="middle" fill="#3b82f6">200M</text>
  <text x="709" y="196" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#1e40af">1 token</text>
