  <rect x="634" y="300" width="150" height="92" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="709" y="328" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" text-anchor="middle" fill="#92400e">Expert 7</text>
  <text x="709" y="352" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="middle" fill="#f59e0b">200M</text>
  <text x="709" y="376" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#92400e">2 token</text>
  <path d="M196,346 L626,346" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a7)"/>
  <rect x="800" y="300" width="150" height="92" rx="8" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="875" y="328" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" text-anchor="middle" fill="#9f1239">Expert 8</text>
  <text x="875" y="352" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="middle" fill="#f43f5e">200M</text>
  <text x="875" y="376" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#9f1239">1 token</text>
