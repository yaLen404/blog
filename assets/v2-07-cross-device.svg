  <rect x="250" y="260" width="348" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="266" y="284" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280">GPU 3</text>
  <text x="582" y="286" style="font:700 15px Consolas,'SFMono-Regular',monospace" text-anchor="end" fill="#475569">4 token</text>
  <rect x="266" y="300" width="150" height="92" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/>
  <text x="341" y="328" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" text-anchor="middle" fill="#166534">Expert 5</text>
  <text x="341" y="352" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="middle" fill="#22c55e">200M</text>
  <text x="341" y="376" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#166534">2 token</text>
