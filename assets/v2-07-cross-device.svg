  <text x="24" y="40" style="font:600 17px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#1f2937">专家分散在多张 GPU 上（每卡 2 位）</text>
  <defs><marker id="a7r" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#f59e0b"/></marker></defs>
