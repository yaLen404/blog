  <rect x="24" y="76" width="156" height="320" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="102" y="104" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" text-anchor="middle">原设备</text>
  <rect x="46" y="122" width="112" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="102" y="150" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="middle">输入 token</text>
  <rect x="46" y="180" width="112" height="62" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="102" y="208" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" text-anchor="middle" fill="#1d4ed8">Router</text>
  <text x="102" y="230" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="middle" fill="#2563eb">Top-2</text>
  <text x="102" y="268" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="middle">路由先决定</text>
  <text x="102" y="290" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="middle">「谁来算」</text>
  <text x="102" y="312" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="middle">数据就得</text>
  <text x="102" y="334" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="middle">跨卡搬一趟</text>
  <path d="M196,266 L196,150" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a7)"/>
  <rect x="24" y="414" width="952" height="118" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="48" y="442" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" fill="#3730a3">分发 dispatch：token 被送往持有目标专家的那张卡。</text>
  <text x="48" y="468" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" fill="#3730a3">聚合 combine：各卡算完后，结果要跨设备收回，再按权重合并。</text>
  <text x="48" y="494" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" fill="#334155">① 通信量随「被选中的专家数」增长，专家越多、切分越细，跨卡往返越频繁。</text>
  <text x="48" y="518" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" fill="#334155">② 负载不均会被多卡放大，整体吞吐被最慢的那张卡拖住。</text>
  <text x="24" y="558" style="font:italic 12px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#9ca3af">如何设计一套高效的调度与通信算法，把这些设备充分利用起来，是 MoE 落地时最难的工程问题之一。</text>
</svg>
