<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 591" width="1000" height="591" role="img" aria-labelledby="t7 t7d">
  <title id="t7">MoE 的跨设备通信开销</title>
  <desc id="t7d">8 位专家分布在 4 张 GPU 上，每卡 2 位；负载不均会让个别卡成为瓶颈。</desc>
