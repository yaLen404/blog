<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t1 d1">
  <title id="t1">从稠密 FFN 到 MoE：一份拆成八个专家</title>
  <desc id="d1">左侧为一个 1600M 的稠密 FFN，右侧为拆成八份后的八个 200M 专家，共用一个 Router。</desc>
  <style>
    .ttl{font:600 17px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2937}
    .sub{font:13px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#6b7280}
    .lbl{font:600 15px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#111827}
    .dim{font:12px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#6b7280}
    .cap{font:italic 12px "Segoe UI","PingFang SC",sans-serif;fill:#9ca3af}
    .edge{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#ah1)}
    .in{stroke:#c7d2fe;stroke-width:1.6;fill:none}
  </style>
  <defs>
    <marker id="ah1" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L7.5,3 L0,6 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text class="ttl" x="30" y="42">稠密 FFN</text>
  <rect x="52" y="72" width="176" height="230" rx="10" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.8"/>
  <text class="lbl" x="140" y="175" text-anchor="middle">FFN</text>
  <text class="lbl" x="140" y="205" text-anchor="middle" fill="#4b5563">1600M</text>
  <text class="dim" x="140" y="232" text-anchor="middle">全部参数参与计算</text>

  <path class="edge" d="M244,187 L316,187"/>
  <text class="cap" x="280" y="175" text-anchor="middle">拆分</text>
  <text class="cap" x="280" y="212" text-anchor="middle">8 份</text>

  <text class="ttl" x="330" y="42">MoE</text>

  <!-- router -->
  <rect x="336" y="150" width="126" height="74" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
  <text class="lbl" x="399" y="181" text-anchor="middle" fill="#1d4ed8">Router</text>
  <text class="dim" x="399" y="204" text-anchor="middle" fill="#2563eb">Top-2</text>
  <text class="cap" x="399" y="248" text-anchor="middle">W_r 打分</text>

  <!-- fan out -->
  <path class="edge" d="M468,160 L580,92"/>
  <path class="edge" d="M468,170 L580,140"/>
  <path class="edge" d="M468,181 L580,188"/>
  <path class="edge" d="M468,190 L580,236"/>
  <path class="edge" d="M468,196 L580,284"/>
  <path class="edge" d="M468,205 L580,332"/>
  <path class="edge" d="M468,214 L580,380"/>
  <path class="edge" d="M468,224 L580,428"/>

  <!-- 8 experts -->
  <g>
    <rect x="586" y="66" width="196" height="44" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.7"/>
    <text class="lbl" x="660" y="94" fill="#6b21a8" font-size="14">Expert 1</text>
    <text class="dim" x="762" y="94" text-anchor="end" fill="#9333ea">200M</text>

    <rect x="586" y="114" width="196" height="44" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.7"/>
    <text class="lbl" x="660" y="142" fill="#3730a3" font-size="14">Expert 2</text>
    <text class="dim" x="762" y="142" text-anchor="end" fill="#4f46e5">200M</text>

    <rect x="586" y="162" width="196" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.7"/>
    <text class="lbl" x="660" y="190" fill="#1e40af" font-size="14">Expert 3</text>
    <text class="dim" x="762" y="190" text-anchor="end" fill="#2563eb">200M</text>

    <rect x="586" y="210" width="196" height="44" rx="8" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.7"/>
    <text class="lbl" x="660" y="238" fill="#115e59" font-size="14">Expert 4</text>
    <text class="dim" x="762" y="238" text-anchor="end" fill="#0d9488">200M</text>

    <rect x="586" y="258" width="196" height="44" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.7"/>
    <text class="lbl" x="660" y="286" fill="#166534" font-size="14">Expert 5</text>
    <text class="dim" x="762" y="286" text-anchor="end" fill="#16a34a">200M</text>

    <rect x="586" y="306" width="196" height="44" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.7"/>
    <text class="lbl" x="660" y="334" fill="#854d0e" font-size="14">Expert 6</text>
    <text class="dim" x="762" y="334" text-anchor="end" fill="#ca8a04">200M</text>

    <rect x="586" y="354" width="196" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.7"/>
    <text class="lbl" x="660" y="382" fill="#92400e" font-size="14">Expert 7</text>
    <text class="dim" x="762" y="382" text-anchor="end" fill="#d97706">200M</text>

    <rect x="586" y="402" width="196" height="44" rx="8" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.7"/>
    <text class="lbl" x="660" y="430" fill="#9f1239" font-size="14">Expert 8</text>
    <text class="dim" x="762" y="430" text-anchor="end" fill="#e11d48">200M</text>
  </g>

  <rect x="822" y="120" width="150" height="180" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text class="sub" x="897" y="150" text-anchor="middle">总参数</text>
  <text class="lbl" x="897" y="176" text-anchor="middle" font-size="18">1600M</text>
  <text class="sub" x="897" y="216" text-anchor="middle">激活 / token</text>
  <text class="lbl" x="897" y="242" text-anchor="middle" font-size="18" fill="#15803d">400M</text>
  <text class="dim" x="897" y="272" text-anchor="middle">仅 25%</text>

  <text class="cap" x="30" y="496">专家在结构上都是 FFN，区别只在于训练中各自学到的擅长方向不同；由 Router 决定每个 token 请哪两位上场。</text>
</svg>
