<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 583" width="1000" height="583" role="img" aria-labelledby="t6 t6d">
  <title id="t6">MoE 的负载不均衡</title>
  <desc id="t6d">8 个 token、k=2 共 16 个专家槽位，Expert 2 独占 6 个，另有四位专家各只分到 1 个。</desc>
  <text x="24" y="40" style="font:600 17px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#1f2937">负载不均（Load Imbalance）：8 个 token，8 位专家，k = 2</text>
  <text x="24" y="68" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280">8 个 token × k = 16 个「专家槽位」，实际分配如下：</text>
  <text x="830" y="68" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" text-anchor="middle">收到的 token</text>
  <text x="120" y="103" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" text-anchor="end" fill="#3730a3">Expert 2</text>
  <rect x="134" y="87" width="508" height="22" rx="5" fill="#6366f1" stroke="#6366f1" stroke-width="1"/>
  <text x="144" y="103" style="font:600 13px Consolas,'SFMono-Regular',monospace" fill="#ffffff">6 个</text>
  <text x="830" y="103" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#6b7280">t0 t2 t3 t4 t6 t7</text>
  <text x="120" y="143" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" text-anchor="end" fill="#166534">Expert 5</text>
  <rect x="134" y="127" width="196" height="22" rx="5" fill="#22c55e" stroke="#22c55e" stroke-width="1"/>
  <text x="144" y="143" style="font:600 13px Consolas,'SFMono-Regular',monospace" fill="#ffffff">2 个</text>
  <text x="830" y="143" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#6b7280">t1 t4</text>
  <text x="120" y="183" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" text-anchor="end" fill="#854d0e">Expert 6</text>
  <rect x="134" y="167" width="196" height="22" rx="5" fill="#eab308" stroke="#eab308" stroke-width="1"/>
  <text x="144" y="183" style="font:600 13px Consolas,'SFMono-Regular',monospace" fill="#ffffff">2 个</text>
  <text x="830" y="183" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#6b7280">t3 t6</text>
  <text x="120" y="223" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" text-anchor="end" fill="#92400e">Expert 7</text>
  <rect x="134" y="207" width="196" height="22" rx="5" fill="#f59e0b" stroke="#f59e0b" stroke-width="1"/>
  <text x="144" y="223" style="font:600 13px Consolas,'SFMono-Regular',monospace" fill="#ffffff">2 个</text>
  <text x="830" y="223" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#6b7280">t1 t5</text>
  <text x="120" y="263" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" text-anchor="end" fill="#6b21a8">Expert 1</text>
  <rect x="134" y="247" width="118" height="22" rx="5" fill="#a855f7" stroke="#a855f7" stroke-width="1"/>
  <text x="144" y="263" style="font:600 13px Consolas,'SFMono-Regular',monospace" fill="#ffffff">1 个</text>
  <text x="830" y="263" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#6b7280">t7</text>
  <text x="120" y="303" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" text-anchor="end" fill="#1e40af">Expert 3</text>
  <rect x="134" y="287" width="118" height="22" rx="5" fill="#3b82f6" stroke="#3b82f6" stroke-width="1"/>
  <text x="144" y="303" style="font:600 13px Consolas,'SFMono-Regular',monospace" fill="#ffffff">1 个</text>
  <text x="830" y="303" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#6b7280">t5</text>
  <text x="120" y="343" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" text-anchor="end" fill="#115e59">Expert 4</text>
  <rect x="134" y="327" width="118" height="22" rx="5" fill="#14b8a6" stroke="#14b8a6" stroke-width="1"/>
  <text x="144" y="343" style="font:600 13px Consolas,'SFMono-Regular',monospace" fill="#ffffff">1 个</text>
  <text x="830" y="343" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#6b7280">t0</text>
  <text x="120" y="383" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" text-anchor="end" fill="#9f1239">Expert 8</text>
  <rect x="134" y="367" width="118" height="22" rx="5" fill="#f43f5e" stroke="#f43f5e" stroke-width="1"/>
  <text x="144" y="383" style="font:600 13px Consolas,'SFMono-Regular',monospace" fill="#ffffff">1 个</text>
  <text x="830" y="383" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" text-anchor="middle" fill="#6b7280">t2</text>
  <rect x="24" y="434" width="952" height="92" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="44" y="462" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" fill="#b91c1c">训练时：Expert 1 / 3 / 4 / 8 各只拿到 1 个 token，梯度严重不足 → 欠训练。</text>
  <text x="44" y="486" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" fill="#991b1b">推理时：少数专家承担大部分计算，其余长期闲置 → 参数被浪费。</text>
  <text x="44" y="510" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" fill="#991b1b">想让 MoE 真正发挥优点，必须先解决负载不均衡。</text>
  <text x="24" y="550" style="font:italic 12px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#9ca3af">补充：负载分布为 6 / 2 / 2 / 2 / 1 / 1 / 1 / 1，极差达 5。</text>
</svg>
