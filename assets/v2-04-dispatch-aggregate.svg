<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 626" width="1000" height="626" role="img" aria-labelledby="t4 t4d">
  <title id="t4">多 token 的分发、并行计算与聚合</title>
  <desc id="t4d">8 个 token 经 Top-2 分发到 8 位专家，各专家只处理被分到的 token，彼此互不依赖可并行。</desc>
  <defs><marker id="a4" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
  <text x="24" y="38" style="font:600 17px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#1f2937">Top-2 之后：数据被分发给各位专家（负载并不相等）</text>
  <text x="24" y="66" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280">输入 token</text>
