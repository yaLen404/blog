  <text x="628" y="230" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" fill="#854d0e">t3  t6</text>
  <text x="628" y="252" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" fill="#eab308">权重 0.881 / 0.119</text>
  <rect x="612" y="272" width="340" height="84" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.9"/>
