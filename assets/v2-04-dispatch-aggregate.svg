  <rect x="228" y="70" width="736" height="394" rx="12" fill="none" stroke="#c7d2fe" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="24" y="504" style="font:600 15px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#1f2937">分发 dispatch</text>
  <text x="200" y="504" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" fill="#4f46e5">Router 先决定每个 token 去哪些专家，数据再被送往对应设备。</text>
  <text x="24" y="548" style="font:600 15px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#1f2937">并行 parallel</text>
  <text x="200" y="548" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" fill="#16a34a">八位专家之间没有任何依赖，可以同时计算 —— 这是 MoE 吞吐友好的来源。</text>
  <text x="24" y="592" style="font:600 15px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#1f2937">聚合 combine</text>
  <text x="200" y="592" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" fill="#d97706">各专家算完后，按该 token 的两个权重把结果相加，还原出各自的 h。</text>
</svg>
