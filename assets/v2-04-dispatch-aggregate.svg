  <text x="936" y="114" style="font:700 15px Consolas,'SFMono-Regular',monospace" text-anchor="end" fill="#166534">2 个</text>
  <text x="628" y="136" style="font:600 12.5px Consolas,'SFMono-Regular',monospace;fill:#111827" fill="#166534">t1  t4</text>
  <text x="628" y="158" style="font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280" fill="#22c55e">权重 0.881</text>
  <rect x="612" y="178" width="340" height="84" rx="9" fill="#fef9c3" stroke="#eab308" stroke-width="1.9"/>
  <text x="628" y="204" style="font:600 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111827" fill="#854d0e">Expert 6</text>
